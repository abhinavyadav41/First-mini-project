<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>You're Offline - NoteNest</title>
  <meta name="theme-color" content="#4F46E5">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #070B1A;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(99, 102, 241, 0.2);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(12px);
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #4F46E5, #3730A3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
    }
    .icon-wrapper svg {
      width: 36px;
      height: 36px;
      color: #FFFFFF;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: #FFFFFF;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #94A3B8;
      margin-bottom: 28px;
    }
    .btn-retry {
      background: #4F46E5;
      color: #FFFFFF;
      border: none;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-retry:hover {
      background: #4338CA;
      transform: translateY(-1px);
    }
    .btn-retry:active {
      transform: translateY(1px);
    }
    .brand {
      margin-top: 24px;
      font-size: 12px;
      color: #64748B;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 7.5h.008v.008H12v-.008z" />
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>Some NoteNest features require an internet connection.</p>
    <button class="btn-retry" onclick="window.location.reload()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      Try Again
    </button>
    <div class="brand">NoteNest • Study Hub</div>
  </div>
</body>
</html>
